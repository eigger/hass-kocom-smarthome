# Shared standards; upstream action SHAs verified 2026-10-17.
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Test current HA and the exact existing minimum in separate environments.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1
    with:
      # Use the same reviewed standards SHA as the reusable workflow.
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: kocom_smarthome
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      pytest-args: tests/components/kocom_smarthome/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: kocom_smarthome
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.8.0'
      test-profile: ha
      pytest-args: tests/components/kocom_smarthome/ -v
