name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: python -m ruff check custom_components/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio aiohttp voluptuous

      - name: Run tests
        # test_ha_integration.py imports api.py, which imports const.py, which
        # imports Home Assistant itself — real HA doesn't support Python 3.12,
        # so that file is excluded here and covered by test-min-ha below
        # instead.
        run: python -m pytest tests/ -v --ignore=tests/test_ha_integration.py

  test-min-ha:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read the minimum supported Home Assistant version from hacs.json
        id: min_ha
        run: |
          version=$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install that Home Assistant version
        run: |
          pip install --upgrade pip
          pip install "homeassistant==${{ steps.min_ha.outputs.version }}" pytest pytest-asyncio aiohttp

      - name: Run the tests that require Home Assistant
        # Exercises KocomClient end to end (digest challenge, auth retry,
        # ikod fallback, zoneid math, JSON parsing) against the oldest Home
        # Assistant this integration claims to support, so a hacs.json bump
        # that turns out to be wrong fails CI instead of a user's install.
        run: python -m pytest tests/test_ha_integration.py -v
